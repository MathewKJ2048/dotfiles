[general]
compat-delete='delete-sequence'
display-n=0
display-tab-names=0
gtk-theme-name='Default'
gtk-use-system-default-theme=true
hide-tabs-if-one-tab=true
history-size=1000
load-guake-yml=true
max-tab-name-length=100
mouse-display=true
open-tab-cwd=true
prompt-on-quit=true
quick-open-command-line='gedit %(file_path)s'
restore-tabs-notify=true
restore-tabs-startup=true
save-tabs-when-changed=true
schema-version='3.10.1'
scroll-keystroke=true
start-at-login=true
start-fullscreen=false
use-default-font=false
use-popup=false
use-scrollbar=true
use-trayicon=false
window-halignment=0
window-height=50
window-losefocus=false
window-ontop=true
window-refocus=false
window-tabbar=true
window-valignment=0
window-width=100

[keybindings/global]
show-hide='<Alt>w'

[keybindings/local]
close-tab='<Primary><Shift>z'
close-terminal='<Primary><Shift>greater'
decrease-height='<Primary>Up'
focus-terminal-down='<Primary><Shift>Down'
focus-terminal-left='<Primary><Shift>Left'
focus-terminal-right='<Primary><Shift>Right'
focus-terminal-up='<Primary><Shift>Up'
increase-height='<Primary>Down'
move-terminal-split-down='disabled'
move-terminal-split-left='disabled'
move-terminal-split-right='disabled'
move-terminal-split-up='disabled'
new-tab='<Primary><Shift>asciitilde'
new-tab-home='<Primary><Shift>h'
quit='<Primary><Shift>q'
rename-current-tab='disabled'
split-tab-horizontal='<Primary><Shift>underscore'
split-tab-vertical='<Primary><Shift>bar'
toggle-fullscreen='<Primary>f'

[style/background]
transparency=88

[style/font]
allow-bold=true
palette='#252529292A2A:#F2F248484040:#626296965555:#B6B688880000:#20207575C7C7:#79797F7FD4D4:#151596968D8D:#D2D2D8D8D9D9:#252529292A2A:#F2F248484040:#626296965555:#B6B688880000:#20207575C7C7:#79797F7FD4D4:#151596968D8D:#D2D2D8D8D9D9:#D2D2D8D8D9D9:#3D3D3F3F4141'
palette-name='Solarized Darcula'
style='JetBrains Mono 10'
